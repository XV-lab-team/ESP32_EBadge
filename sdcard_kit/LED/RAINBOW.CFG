# RAINBOW.CFG — hue chase 1->5, 12 steps, ~80ms/frame
ver=1
name=rainbow

[cal]
gain_r=100
gain_g=100
gain_b=100

[script]
set 1 255 0 0
set 2 255 127 0
set 3 255 255 0
