set 4 0 255 255
set 5 0 127 255
wait 80
set 1 0 255 0
set 2 0 255 127
set 3 0 255 255
set 4 0 127 255
set 5 0 0 255
wait 80
set 1 0 255 127
set 2 0 255 255
set 3 0 127 255
set 4 0 0 255
set 5 127 0 255
wait 80
set 1 0 255 255
set 2 0 127 255
set 3 0 0 255
set 4 127 0 255
set 5 255 0 255
wait 80
set 1 0 127 255
set 2 0 0 255
set 3 127 0 255
set 4 255 0 255
set 5 255 0 127
wait 80
set 1 0 0 255
set 2 127 0 255
set 3 255 0 255
set 4 255 0 127
set 5 255 0 0
