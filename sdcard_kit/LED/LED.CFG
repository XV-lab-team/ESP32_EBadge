# LED.CFG v1 — copy the LED folder to SD card root (8.3 names)
ver=1
name=demo

[cal]
# percent 0-200; 100 = no change. RGB imbalance TBD, keep 100 for now
gain_r=100
gain_g=100
gain_b=100

[script]
off
wait 200
set 1 255 0 0
wait 300
set 1 0 255 0
wait 300
set 1 0 0 255
wait 300
set all 40 40 40
wait 500
off
wait 400
loop 0
